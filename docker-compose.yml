# docker compose up -d
# MongoDB -> localhost:27017 | HBase (Thrift) -> localhost:9090 | HBase Master UI -> http://localhost:16010
services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  hbase:
    image: harisekhon/hbase:latest
    container_name: hbase
    hostname: hbase
    ports:
      - "2181:2181"     # ZooKeeper
      - "16010:16010"   # Master UI
      - "9090:9090"     # Thrift (used by happybase)
      - "8080:8080"     # REST
    volumes: ["hbase_data:/hbase-data"]

volumes:
  mongo_data:
  hbase_data:
